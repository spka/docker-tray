name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'spka/docker-tray'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and source versions
        id: version
        run: |
          version="$(./scripts/release-version "$GITHUB_REF_NAME")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gtk-3.0 \
            python3-gi \
            python3-pil \
            python3-pystray

      - name: Run tests and static validation
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile docker_tray.py docker_tray_platform.py docker_tray_privileged.py
          sh -n docker-tray-docker package-deb.sh scripts/release-version
          desktop-file-validate docker-tray.desktop

      - name: Build and inspect Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./package-deb.sh "$VERSION"
          package="dist/docker-tray_${VERSION}_all.deb"
          test "$(dpkg-deb --field "$package" Package)" = "docker-tray"
          test "$(dpkg-deb --field "$package" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$package" Architecture)" = "all"
          dpkg-deb --contents "$package"
          (cd dist && sha256sum "docker-tray_${VERSION}_all.deb" > "docker-tray_${VERSION}_all.deb.sha256")

      - name: Attest Debian package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/docker-tray_${{ steps.version.outputs.version }}_all.deb

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          package="dist/docker-tray_${VERSION}_all.deb"
          checksum="${package}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            test "$draft" = "true"
            gh release upload "$GITHUB_REF_NAME" "$package" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$package" "$checksum" \
              --draft \
              --generate-notes \
              --title "Docker Tray ${VERSION}" \
              --verify-tag
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
