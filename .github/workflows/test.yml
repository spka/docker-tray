name: Test and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gtk-3.0 \
            python3-gi \
            python3-pil \
            python3-pystray
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate scripts and desktop files
        run: |
          python3 -m py_compile docker_tray.py docker_tray_platform.py docker_tray_privileged.py
          sh -n docker-tray-docker
          desktop-file-validate docker-tray.desktop
      - name: Build Debian package
        run: ./package-deb.sh 0.2.6
      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/docker-tray_0.2.6_all.deb
          dpkg-deb --contents dist/docker-tray_0.2.6_all.deb
