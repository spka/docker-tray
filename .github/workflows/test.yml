name: Test and package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gtk-3.0 \
            python3-gi \
            python3-pil \
            python3-pystray
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate scripts and desktop files
        run: |
          python3 -m py_compile docker_tray.py docker_tray_platform.py docker_tray_privileged.py
          sh -n docker-tray-docker package-deb.sh scripts/release-version
      - name: Build Debian package
        run: |
          version="$(./scripts/release-version)"
          ./package-deb.sh "$version"
          package_root="dist/docker-tray_${version}_all"
          desktop-file-validate "$package_root/usr/share/applications/docker-tray.desktop"
          desktop-file-validate "$package_root/etc/xdg/autostart/docker-tray.desktop"
      - name: Inspect Debian package
        run: |
          version="$(./scripts/release-version)"
          dpkg-deb --info "dist/docker-tray_${version}_all.deb"
          dpkg-deb --contents "dist/docker-tray_${version}_all.deb"
